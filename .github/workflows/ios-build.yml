name: Build KMP iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger the build manually with a button on GitHub

jobs:
  build-ios:
    runs-on: macos-latest # Apple Silicon (M-series) macOS runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Shared KMP Framework for iOS Simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS App for Simulator (.app)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
             CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload Simulator .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/iosApp.app

      - name: Build Unsigned iOS Device App & Package as .ipa
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -r build_device/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r iosApp-unsigned.ipa Payload

      - name: Upload Unsigned .ipa Artifact (For iPhone Sideloading on Windows)
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: iosApp-unsigned.ipa